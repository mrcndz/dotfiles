config-version = 2
start-at-login = true
accordion-padding = 30
after-startup-command = []
enable-normalization-flatten-containers = true
enable-normalization-opposite-orientation-for-nested-containers = true
default-root-container-layout = 'tiles'
default-root-container-orientation = 'auto'
on-focused-monitor-changed = ['move-mouse monitor-lazy-center']
automatically-unhide-macos-hidden-apps = false
persistent-workspaces = ["1", "2", "3", "4", "5", "6", "7", "8", "9", "g"]

[gaps]
    inner.horizontal = 4
    inner.vertical =   2
    outer.left =       8
    outer.bottom =     8
    outer.top =        8
    outer.right =      8

[mode.main.binding]
    alt-1 = 'workspace 1'
    alt-2 = 'workspace 2'
    alt-3 = 'workspace 3'
    alt-4 = 'workspace 4'
    alt-5 = 'workspace 5'
    alt-6 = 'workspace 6'
    alt-7 = 'workspace 7'
    alt-8 = 'workspace 8'
    alt-9 = 'workspace 9'
    alt-shift-1 = ['move-node-to-workspace 1', 'workspace 1']
    alt-shift-2 = ['move-node-to-workspace 2', 'workspace 2']
    alt-shift-3 = ['move-node-to-workspace 3', 'workspace 3']
    alt-shift-4 = ['move-node-to-workspace 4', 'workspace 4']
    alt-shift-5 = ['move-node-to-workspace 5', 'workspace 5']
    alt-shift-6 = ['move-node-to-workspace 6', 'workspace 6']
    alt-shift-7 = ['move-node-to-workspace 7', 'workspace 7']
    alt-shift-8 = ['move-node-to-workspace 8', 'workspace 8']
    alt-shift-9 = ['move-node-to-workspace 9', 'workspace 9']
    alt-shift-backspace = ['close-all-windows-but-current', 'mode main']
    alt-tab = 'workspace-back-and-forth'
    alt-ctrl-tab = 'move-workspace-to-monitor --wrap-around next'

    alt-slash = 'layout tiles horizontal vertical'
    alt-comma = 'layout accordion horizontal vertical'
    alt-h = 'focus left'
    alt-j = 'focus down'
    alt-k = 'focus up'
    alt-l = 'focus right'
    alt-ctrl-h = 'move left'
    alt-ctrl-j = 'move down'
    alt-ctrl-k = 'move up'
    alt-ctrl-l = 'move right'
    alt-minus = 'resize smart -250'
    alt-equal = 'resize smart +250'
    alt-shift-space = 'layout floating tiling'
    alt-z = 'fullscreen'
    alt-ctrl-cmd-h = 'join-with left'
    alt-ctrl-cmd-j = 'join-with down'
    alt-ctrl-cmd-k = 'join-with up'
    alt-ctrl-cmd-l = 'join-with right'

    # Terminal workspace: toggle via back-and-forth if already there, else jump in
    cmd-backtick = '''exec-and-forget /bin/sh -c 'if [ "$(/opt/homebrew/bin/aerospace list-workspaces --focused)" = "\`" ]; then /opt/homebrew/bin/aerospace workspace-back-and-forth; else /opt/homebrew/bin/aerospace workspace \` && /usr/bin/open -a Ghostty; fi' '''
    cmd-shift-backtick = ['move-node-to-workspace `', 'workspace `']

[[on-window-detected]]
    if.app-id="com.mitchellh.ghostty"
    run= ["move-node-to-workspace `"]

[mode.service.binding]
    esc = ['reload-config', 'mode main']
    r = ['flatten-workspace-tree', 'mode main'] # reset layout
    f = ['layout floating tiling', 'mode main'] # Toggle between floating and tiling layout
