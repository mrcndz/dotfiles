onboarding = false

[keys]
prefix = "ctrl+a"                       

reload_config = "prefix+shift+r"        
new_tab = "prefix+t"

# Workspaces
workspace_picker = "prefix+s"
new_workspace = "prefix+n"
navigate_workspace_up = "k"
navigate_workspace_down = "j"
close_workspace = "prefix+shift+x"

goto = "prefix+w"
previous_tab = "prefix+space"           
split_vertical = "prefix+|"
split_horizontal = "prefix+minus"

#
edit_scrollback = "prefix+shift+e"
rename_tab = "prefix+comma"
settings = "prefix+shift+comma"

# --- pane focus (prefix+hjkl) ---
last_pane = "prefix+;"
focus_pane_left = "prefix+h"
focus_pane_down = "prefix+j"
focus_pane_up = "prefix+k"
focus_pane_right = "prefix+l"

# Persistent popups (persistent-tmux-popup plugin): tmux session per
# tool + pane; detach closes the popup, the process keeps running.
# nvim popup is not persistent: auto-session restores buffers per git root
[[keys.command]]
key = "prefix+e"
type = "popup"
command = 'cd "${HERDR_ACTIVE_PANE_CWD:-$HOME}" && exec nvim'
description = "n!vim"
width = "90%"
height = "90%"

[[keys.command]]
key = "prefix+g"
type = "plugin_action"
command = "persistent-tmux-popup.lazygit"
description = "lazygit (persistent)"

[[keys.command]]
key = "prefix+p"
type = "popup"
command = 'exec fish'
description = "shell"

[[keys.command]]
key = "prefix+@"                   # @ : copy pane info to clipboard
type = "shell"
command = "echo herdr pane: $HERDR_ACTIVE_PANE_ID | pbcopy"
description = "copy pane info"

# Nvim + Herdr navigation
[[keys.command]]
key = "ctrl+h"
type = "plugin_action"
command = "vim-herdr-navigation.left"
description = "navigate left (vim/herdr)"

[[keys.command]]
key = "ctrl+j"
type = "plugin_action"
command = "vim-herdr-navigation.down"
description = "navigate down (vim/herdr)"

[[keys.command]]
key = "ctrl+k"
type = "plugin_action"
command = "vim-herdr-navigation.up"
description = "navigate up (vim/herdr)"

[[keys.command]]
key = "ctrl+l"
type = "plugin_action"
command = "vim-herdr-navigation.right"
description = "navigate right (vim/herdr)"

[ui]
confirm_close = true
show_agent_labels_on_pane_borders = true

agent_panel_sort = "priority"
[ui.toast]
delivery = "terminal"

[theme]
auto_switch = true
light_name = "gruvbox-light"
dark_name = "rose-pine-moon"
