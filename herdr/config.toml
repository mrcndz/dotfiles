onboarding = false

[terminal]
default_shell = "/opt/homebrew/bin/fish"

[keys]
prefix = "ctrl+a"                       

reload_config = "prefix+shift+r"        
new_tab = "prefix+t"

# Workspaces
workspace_picker = "prefix+s"
new_workspace = "prefix+n"
navigate_workspace_up = "k"
navigate_workspace_down = "j"
close_workspace = "prefix+shift+x"

goto = "prefix+w"
previous_tab = "prefix+space"           
split_vertical = "prefix+|"
split_horizontal = "prefix+minus"

#
edit_scrollback = "prefix+shift+e"
settings = "prefix+<"

# --- pane focus (prefix+hjkl) ---
last_pane = "prefix+;"
focus_pane_left = "ctrl+h"
focus_pane_down = "ctrl+j"
focus_pane_up = "ctrl+k"
focus_pane_right = "ctrl+l"

[[keys.command]]
key = "prefix+e"
type = "plugin_action"
command = "chmarax.herdr-nvim.toggle"
description = "nvim sidebar"

[[keys.command]]
key = "prefix+o"
type = "shell"
command = 'exec fish -c "tern-popup fish -c herdr-file-pick"'
description = "pick file from screen"

[[keys.command]]
key = "prefix+shift+o"
type = "plugin_action"
command = "openr.pick-transcript"
description = "open file/URL from Claude transcript"

[[keys.command]]
key = "prefix+g"
type = "popup"
command = 'exec "$DOTFILES/scripts/tmux-popup" lazygit --use-config-file "$HOME/.config/lazygit/config.yml,$HOME/.config/lazygit/popup-config.yml"'
description = "lazygit"
width = "90%"
height = "90%"

[[keys.command]]
key = "prefix+p"
type = "popup"
command = 'exec fish'
description = "shell"

[[keys.command]]
key = "prefix+f"
type = "plugin_action"
command = "rmarganti.herdr-pluck.pluck"
description = "pluck visible token"

[[keys.command]]
key = "prefix+@"                   # @ : copy pane info to clipboard
type = "shell"
command = "echo $HERDR_ACTIVE_PANE_ID | pbcopy"
description = "copy pane info"

[[keys.command]]
key = "prefix+y"                   # @ : copy workspace info to clipboard
type = "shell"
command = "echo $HERDR_ACTIVE_WORKSPACE_ID | pbcopy"
description = "copy workspace info"

[[keys.command]]
key = "prefix+Y"                   # @ : copy tab info to clipboard
type = "shell"
command = "echo $HERDR_ACTIVE_TAB_ID | pbcopy"
description = "copy tab info"

[[keys.command]]
key = "prefix+#"                   # # : copy agent session id to clipboard
type = "shell"
command = "herdr pane get $HERDR_ACTIVE_PANE_ID | jq -r '.result.pane.agent_session.value' | tr -d '\\n' | pbcopy"
description = "copy agent session id"

[[keys.command]]
  key = "prefix+a"
  type = "plugin_action"
  command = "herdr-projects.open"
  description = "work board"

[[keys.command]]
key = "prefix+shift+r"
type = "plugin_action"
command = "herdr-agent-quota.refresh"
description = "refresh all agent quotas"

[[keys.command]]
key = "prefix+shift+q"
type = "plugin_action"
command = "herdr-agent-quota.open-settings"
description = "open agent quota settings"

[ui]
confirm_close = true
show_agent_labels_on_pane_borders = true

agent_panel_sort = "spaces"
[ui.toast]
delivery = "herdr"

[ui.toast.herdr]
position = "bottom-left"

[ui.sidebar]

[ui.sidebar.agents]
row_gap = 1 # herdr-agent-quota
rows = [["state_icon", { token = "tab", bold = true, dim = false }, { token = "$quota_provider_model", bold = true, dim = false }], [{ token = "$quota_topic", bold = false, dim = false }], [{ token = "$quota_error", fg = "#e4b957", bold = false, dim = false }], [{ token = "$quota_context", bold = false, dim = false }], [{ token = "$quota_5h_normal", fg = "#82d978", bold = false, dim = false }, { token = "$quota_5h_warning", fg = "#e4b957", bold = false, dim = false }, { token = "$quota_5h_danger", fg = "#f16f7e", bold = false, dim = false }, { token = "$quota_5h_unknown", bold = false, dim = false }]] # herdr-agent-quota-row

