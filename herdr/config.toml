[ui.sidebar.spaces]
rows = [
  ["state_icon", { token = "workspace", fg = "#4d7a87", bold = true, dim = false }],
  ["branch", "git_status"],
]

[theme]
auto_switch = true
light_name = "gruvbox-light"
dark_name = "rose-pine"

[experimental]
pane_history = true
switch_ascii_input_source_in_prefix = false
