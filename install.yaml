pre_commands:
 - git clone https://github.com/tmux-plugins/tpm ~/.tmux/plugins/tpm
 - git clone https://github.com/paulbkim-dev/vim-herdr-navigation ~/.config/herdr/plugins/vim-herdr-navigation
 - git update-index --assume-unchanged $DOTFILES/env.fish
 - git config --global rebase.autoStash true

symlinks:
  - ~/.config/fish/fish_plugins: $DOTFILES/fish/fish_plugins
  - ~/.config/fish/config.fish: $DOTFILES/fish/config.fish 
  - ~/.config/fish/completions/just.fish: $DOTFILES/fish/completions/just.fish
  - ~/.tmux.conf: $DOTFILES/tmux/tmux.conf 
  - ~/.config/nvim: $DOTFILES/nvim
  - ~/.zshrc: $DOTFILES/zsh/zshrc
  - ~/.bashrc: $DOTFILES/bash/bashrc
  - ~/.config/lazygit: $DOTFILES/lazygit
  - ~/.config/just: $DOTFILES/just
  - ~/.claude/_scripts: $DOTFILES/claude/_scripts
  - ~/.claude/settings.json: $DOTFILES/claude/settings.json
  - ~/.claude/CLAUDE.md: $DOTFILES/claude/CLAUDE.md

symlinks-linux:
  - ~/.config/alacritty/alacritty.toml: $DOTFILES/alacritty/alacritty-linux.toml

symlinks-darwin:
  - ~/.config/ghostty: $DOTFILES/ghostty
  - ~/.hammerspoon: $DOTFILES/hammerspoon
  - ~/.config/glide/glide.toml: $DOTFILES/glide/glide.toml
  - ~/.config/herdr/config.toml: $DOTFILES/herdr/config.toml

post_commands:
  - curl -sL https://git.io/fisher | source && fisher update
  - source $DOTFILES/fish/config.fish
  - ~/.tmux/plugins/tpm/bin/install_plugins
  - sed -i 's/"credsStore"/"credStore"/g' ~/.docker/config.json
  - git config --global core.excludesFile $DOTFILES/git/gitignore
